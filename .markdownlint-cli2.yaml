# brain-pattern markdown lint config
#
# Discipline: catch *malformed* markdown, not *unfashionable* markdown.
# This is a teaching artefact authored by humans for humans; we accept
# variation in style as long as the structure is sound.
#
# The rules below are turned OFF deliberately. Everything else is on.

config:
  # MD013: line length. Prose paragraphs are written to read well, not to fit
  # in 80 columns. Markdown renderers wrap. Hard line limits punish good prose.
  MD013: false

  # MD024: duplicate headings. Worked-example sections legitimately repeat
  # subheading names ("Loop 1", "Loop 2", etc.) under different parents.
  # markdownlint's `siblings_only` mode would help but isn't worth tuning.
  MD024: false

  # MD033: inline HTML. We don't use it today, but a future revision might
  # legitimately drop in a <details> block. Don't ban what we haven't used yet.
  MD033: false

  # MD034: bare URLs. We deliberately use bare URLs in some prose contexts
  # (the GitHub-friendly "click this URL" idiom). Linkifying every one is
  # noise without value.
  MD034: false

  # MD036: emphasis used instead of a heading. The author signature
  # `*From [LodgeiT Labs]… Maintained by ClawDog ∮*` is intentionally
  # rendered as italic emphasis, not as a heading. Demoting it to a
  # heading would change the rendered shape; this is style, not structure.
  MD036: false

  # MD040: fenced code language. Some code blocks intentionally omit a
  # language hint (generic shell snippets, output samples, ledger fragments
  # that mix YAML+prolog+log lines). Forcing a language tag would either
  # mis-highlight or require artificial choices. Style, not structure.
  MD040: false

  # MD041: first line must be a top-level heading. Both files already comply,
  # but disabling lets a future revision open with a quote/note block if it
  # wants to. Cheap permission, no cost.
  MD041: false

  # MD056: table column count. Disabled because the linter false-positives
  # on tables whose cells contain inline code with literal pipes (e.g.
  # `\`active | dormant | closed\`` inside a row). The pipe parser does
  # not honour code-span boundaries. Re-enable if/when markdownlint fixes
  # the parser, or if a real table-shape regression makes the false-
  # positive cost lower than the catch value.
  MD056: false

  # MD060: table column style. Both documents use the "compact" pipe style
  # (`|cell|cell|`) consistently throughout, including in the original
  # Architect-authored sections. Adopting the "padded" style would mean
  # rewriting every table for cosmetic conformity — a Privacy-Gradient
  # violation against the v1 voice-preservation discipline. Style, not
  # structure.
  MD060: false

# Glob the markdown files at repo root. LICENSE is plain text, not markdown.
globs:
  - "*.md"
